name: Build Minecraft Mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build Minecraft Mod
        working-directory: BuilderMod
        run: gradle build

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Inventory-Builder-Mod
          path: BuilderMod/build/libs/inventory-builder-0.1.0.jar
